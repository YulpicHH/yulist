appId: app.yulist.desktop
productName: yulist
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
mac:
  category: public.app-category.productivity
  darkModeSupport: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: yulist-${version}-mac-${arch}.${ext}
dmg:
  title: yulist
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
